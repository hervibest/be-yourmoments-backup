version: "3.8"

services:
  # =========================
  # APPLICATION SERVICES
  # =========================

  photo-svc:
    image: ghcr.io/hervibest/photo-svc:${APP_VERSION}
    env_file:
      - .env.photo.development
    networks:
      - backend
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure

  transaction-svc:
    image: ghcr.io/hervibest/transaction-svc:${APP_VERSION}
    env_file:
      - .env.transaction.development
    networks:
      - backend
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure

  upload-svc:
    image: ghcr.io/hervibest/upload-svc:${APP_VERSION}
    env_file:
      - .env.upload.development
    networks:
      - backend
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure

  user-svc:
    image: ghcr.io/hervibest/user-svc:${APP_VERSION}
    env_file:
      - .env.user.development
    volumes:
      - ./user-svc/serviceAccountKey.json:/app/serviceAccountKey.json
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/serviceAccountKey.json
    networks:
      - backend
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure

  notification-svc:
    image: ghcr.io/hervibest/notification-svc:${APP_VERSION}
    env_file:
      - .env.notification.development
    volumes:
      - ./notification-svc/serviceAccountKey.json:/app/serviceAccountKey.json
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/serviceAccountKey.json
    networks:
      - backend
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure

  # =========================
  # INFRASTRUCTURE SERVICES
  # =========================

  redis:
    image: redis:7.2-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - backend
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - backend
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - backend
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  nats:
    image: nats:2.11.2-alpine
    command: ["-js", "-m", "8222"]
    networks:
      - backend
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

    consul:
      image: hashicorp/consul:1.20.6
      command: >
        agent
        -server
        -bootstrap-expect=1
        -ui
        -client=0.0.0.0
        -bind=0.0.0.0
        -advertise=127.0.0.1

    networks:
      - backend
    ports:
      - "127.0.0.1:8500:8500"
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

# =========================
# NETWORKS & VOLUMES
# =========================

networks:
  backend:
    driver: overlay
    attachable: true

volumes:
  pgdata:
  minio-data: